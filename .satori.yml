settings:
  name: "AWSGoat: security checks"
  files: true
  example: satori run satori://cloud/aws-prowler2.yml -d AWS_ACCESS_KEY="$(aws configure get aws_access_key_id --profile demo)" -d AWS_SECRET_KEY="$(aws configure get aws_secret_access_key --profile demo)" -d AWS_ACCOUNT_ID="$(aws sts get-caller-identity --profile demo --query Account --output text)" --report --output

import:
  - satori://cloud/aws-prowler2.yml
